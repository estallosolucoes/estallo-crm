# Deploy na VPS depois que o publish-image publicar as imagens da main. Mesmo desenho do NutriGG: o GitHub
# compila (publish-image.yml); aqui só se manda a VPS trocar a imagem, por uma chave SSH presa a
# /opt/deploy-estallo.sh (infra/vps/deploy-estallo.sh), sem shell. NÃO aplica migrations (ver docs/estallo-vps.md).
# Secrets: VPS_DEPLOY_KEY (chave privada) e VPS_HOST_KEY (linha known_hosts: "IP ssh-ed25519 AAAA...").
name: deploy-vps

on:
  workflow_run:
    workflows: ["Publicar imagem Docker (GHCR)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA completo (40 caracteres) já publicado no GHCR
        required: true

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Configurar chave SSH
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          host=$(printf '%s' "$HOST_KEY" | cut -d' ' -f1)
          echo "::add-mask::$host"
          echo "VPS_HOST=$host" >> "$GITHUB_ENV"

      - name: Enviar o commit e trocar as imagens no Swarm
        run: git archive "$SHA" | ssh -o BatchMode=yes "root@$VPS_HOST" "estallo $SHA"

      - name: Aguardar o app responder
        run: |
          for _ in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://crm.estallo.com.br/app || true)
            if [ "$code" = "307" ]; then echo "estallo ok"; exit 0; fi
            sleep 10
          done
          echo "crm.estallo.com.br/app não respondeu 307 em 200s (último: $code)"
          exit 1
